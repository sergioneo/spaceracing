<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Space Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: linear-gradient(135deg, rgba(0, 40, 40, 0.85) 0%, rgba(0, 20, 20, 0.95) 100%);
            padding: 12px 16px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.2),
                inset 0 0 20px rgba(0, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
        }
        .hud-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        }
        .hud-item:last-child {
            border-bottom: none;
        }
        .hud-label {
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            color: rgba(0, 255, 255, 0.6);
            text-transform: uppercase;
        }
        .hud-value {
            font-size: 14px;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
        }
        #controls p {
            margin: 5px 0;
            font-size: 12px;
        }
        /* Destination Compass - futuristic HUD design */
        #destination-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            margin-top: 125px;
            width: 80px;
            height: 80px;
            z-index: 100;
            pointer-events: none;
            display: none;
        }
        #destination-arrow.show {
            display: block;
        }
        #destination-arrow::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #00ff00;
            border-radius: 50%;
            box-shadow:
                0 0 10px rgba(0, 255, 0, 0.5),
                inset 0 0 10px rgba(0, 255, 0, 0.2);
            background:
                radial-gradient(circle at center,
                    rgba(0, 40, 0, 0.9) 0%,
                    rgba(0, 20, 0, 0.95) 50%,
                    rgba(0, 10, 0, 0.98) 100%);
        }
        #destination-arrow::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
        }

        /* Compass needle container */
        .compass-needle {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Compass arrow pointing to destination */
        .compass-needle::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 20px solid #00ff00;
            filter: drop-shadow(0 0 6px #00ff00);
        }

        /* Compass center dot */
        .compass-needle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff00;
        }

        /* Distance label */
        .compass-distance {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #00ff00;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #00ff00;
            white-space: nowrap;
        }
        /* Asteroid Warning - clean directional indicator */
        .asteroid-warning {
            position: absolute;
            z-index: 99;
            pointer-events: none;
            width: 40px;
            height: 40px;
        }
        .asteroid-warning::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 100, 0, 0.8);
            border: 2px solid #ff6600;
            border-radius: 50%;
            box-shadow:
                0 0 15px rgba(255, 100, 0, 0.6),
                inset 0 0 10px rgba(255, 150, 0, 0.4);
            animation: warningPulse 1s ease-in-out infinite;
        }

        /* Warning directional arrow */
        .asteroid-warning::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* Directional arrows based on edge position */
        .asteroid-warning.edge-top::after {
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid #ff6600;
            filter: drop-shadow(0 0 4px #ff6600);
        }
        .asteroid-warning.edge-bottom::after {
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 12px solid #ff6600;
            filter: drop-shadow(0 0 4px #ff6600);
        }
        .asteroid-warning.edge-left::after {
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 12px solid #ff6600;
            filter: drop-shadow(0 0 4px #ff6600);
        }
        .asteroid-warning.edge-right::after {
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 12px solid #ff6600;
            filter: drop-shadow(0 0 4px #ff6600);
        }

        @keyframes warningPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease-in;
        }
        .overlay-screen.show {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #crash-screen {
            background: rgba(255, 0, 0, 0.3);
        }
        #win-screen {
            background: rgba(0, 255, 0, 0.3);
        }
        .screen-content {
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            animation: pulse 2s ease-in-out infinite;
            max-width: 90%;
        }
        .screen-title {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 8px;
        }

        /* Mobile-friendly screens */
        @media (max-width: 768px) {
            .screen-content {
                padding: 30px 20px;
                max-width: 85%;
            }
            .screen-title {
                font-size: 36px;
                letter-spacing: 4px;
                margin-bottom: 15px;
            }
            .screen-message {
                font-size: 16px;
                margin-bottom: 20px;
            }
            .screen-time {
                font-size: 24px;
                margin-bottom: 20px;
            }
            .screen-instruction {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .screen-content {
                padding: 25px 15px;
            }
            .screen-title {
                font-size: 28px;
                letter-spacing: 2px;
            }
            .screen-message {
                font-size: 14px;
            }
            .screen-time {
                font-size: 20px;
            }
        }
        #crash-screen .screen-title {
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000;
        }
        #win-screen .screen-title {
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 60px #00ff00;
        }
        .screen-message {
            font-size: 24px;
            margin-bottom: 30px;
            color: #fff;
        }
        .screen-time {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #0ff;
        }
        .screen-instruction {
            font-size: 18px;
            color: #aaa;
            font-style: italic;
        }
        #countdown-overlay {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            display: none;
            text-align: center;
            pointer-events: none;
        }
        #countdown-overlay.show {
            display: block;
        }
        #countdown-number {
            font-size: 200px;
            font-weight: bold;
            color: #00ffff;
            text-shadow:
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 60px #00ffff,
                0 0 80px #00ffff,
                0 0 100px #00ffff;
            animation: countdownPulse 1s ease-in-out;
        }
        @keyframes countdownPulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        #countdown-overlay.go #countdown-number {
            color: #00ff00;
            text-shadow:
                0 0 20px #00ff00,
                0 0 40px #00ff00,
                0 0 60px #00ff00,
                0 0 80px #00ff00,
                0 0 100px #00ff00;
        }

        /* Score Submission Form */
        .score-form {
            margin: 30px 0;
        }
        #player-name {
            width: 300px;
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #0ff;
            background: rgba(0, 20, 40, 0.8);
            color: #fff;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        #player-name:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px #0ff;
        }
        #submit-score-btn {
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #0066ff, #00ccff);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        #submit-score-btn:hover {
            background: linear-gradient(135deg, #0088ff, #00ddff);
            box-shadow: 0 0 20px #0ff;
            transform: scale(1.05);
        }
        #submit-score-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: scale(1);
        }
        #submission-status {
            margin-top: 15px;
            font-size: 16px;
            color: #0ff;
            min-height: 24px;
        }

        /* Leaderboard Screen */
        #leaderboard-screen {
            background: rgba(0, 0, 0, 0.95);
        }
        .leaderboard-content {
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(0, 10, 30, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 200, 255, 0.3);
        }
        .leaderboard-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        .leaderboard-header h1 {
            font-size: 48px;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
            margin-bottom: 10px;
        }
        .leaderboard-header p {
            font-size: 20px;
            color: #fff;
        }
        #close-leaderboard {
            position: absolute;
            top: 0;
            right: 0;
            padding: 10px 25px;
            font-size: 16px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #close-leaderboard:hover {
            background: #ff3333;
            box-shadow: 0 0 15px #ff0000;
        }
        .leaderboard-platforms {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .platform-leaderboard h2 {
            font-size: 32px;
            color: #00ff00;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }
        .leaderboard-list {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0ff;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
        }
        .leaderboard-entry {
            display: grid;
            grid-template-columns: 40px 1fr 100px;
            gap: 15px;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(0, 100, 150, 0.2);
            border-radius: 5px;
            align-items: center;
            transition: all 0.3s ease;
        }
        .leaderboard-entry:hover {
            background: rgba(0, 150, 200, 0.3);
            transform: translateX(5px);
        }
        .leaderboard-entry.top-1 {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.1));
            border-left: 4px solid gold;
        }
        .leaderboard-entry.top-2 {
            background: linear-gradient(90deg, rgba(192, 192, 192, 0.3), rgba(192, 192, 192, 0.1));
            border-left: 4px solid silver;
        }
        .leaderboard-entry.top-3 {
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.3), rgba(205, 127, 50, 0.1));
            border-left: 4px solid #cd7f32;
        }
        .entry-rank {
            font-size: 20px;
            font-weight: bold;
            color: #0ff;
            text-align: center;
        }
        .entry-name {
            font-size: 18px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .entry-time {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
            text-align: right;
        }
        .leaderboard-empty {
            text-align: center;
            color: #888;
            font-size: 18px;
            padding: 40px;
        }

        /* Hamburger Menu Button */
        #menu-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1100;
            width: 50px;
            height: 50px;
            background: rgba(0, 100, 150, 0.8);
            border: 2px solid #0ff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 10px;
            transition: all 0.3s ease;
        }
        #menu-toggle:hover {
            background: rgba(0, 150, 200, 0.9);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        #menu-toggle span {
            display: block;
            width: 25px;
            height: 3px;
            background: #0ff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        #menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(7px, 7px);
        }
        #menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        #menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* Menu Panel */
        #menu-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(0, 10, 30, 0.98);
            border-left: 2px solid #0ff;
            z-index: 1050;
            transition: right 0.3s ease;
            overflow-y: auto;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
        }
        #menu-panel.open {
            right: 0;
        }
        #menu-content {
            padding: 80px 20px 20px 20px;
        }
        #menu-content h3 {
            color: #0ff;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0ff;
        }
        #menu-content h4 {
            color: #00ff00;
            font-size: 18px;
            margin-bottom: 10px;
            margin-top: 5px;
        }
        .menu-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }
        .menu-section:last-child {
            border-bottom: none;
        }
        .menu-btn {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6600, #ff9900);
            color: #fff;
            border: 2px solid #ff6600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .menu-btn:hover {
            background: linear-gradient(135deg, #ff8800, #ffbb00);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.6);
            transform: translateX(-5px);
        }
        #menu-controls p {
            color: #fff;
            margin: 8px 0;
            font-size: 14px;
            padding-left: 10px;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 280px;
            z-index: 150;
            display: none;
            pointer-events: none;
        }

        #mobile-controls.show {
            display: block;
        }

        /* D-Pad Container */
        #dpad-container {
            position: absolute;
            bottom: 20px;
            left: 15px;
            pointer-events: auto;
        }

        #dpad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 4px;
            grid-template-areas:
                ". up ."
                "left center right"
                ". down .";
        }

        #dpad-up { grid-area: up; }
        #dpad-left { grid-area: left; }
        #dpad-center { grid-area: center; pointer-events: none; opacity: 0; }
        #dpad-right { grid-area: right; }
        #dpad-down { grid-area: down; }

        .dpad-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #0ff;
            background: rgba(0, 100, 150, 0.7);
            color: #fff;
            font-size: 28px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            touch-action: none;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-btn:active {
            background: rgba(0, 200, 255, 0.9);
            transform: scale(0.95);
            box-shadow: 0 0 20px #0ff;
        }

        /* Action Buttons */
        #action-buttons {
            position: absolute;
            bottom: 20px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .action-btn {
            width: 85px;
            height: 45px;
            border: 2px solid #ff6600;
            background: rgba(255, 100, 0, 0.7);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            touch-action: none;
            transition: all 0.1s ease;
            text-transform: uppercase;
        }

        .action-btn:active {
            background: rgba(255, 150, 0, 0.9);
            transform: scale(0.95);
            box-shadow: 0 0 20px #ff6600;
        }

        #btn-start {
            border-color: #00ff00;
            background: rgba(0, 200, 0, 0.7);
        }

        #btn-start:active {
            background: rgba(0, 255, 0, 0.9);
            box-shadow: 0 0 20px #00ff00;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .leaderboard-platforms {
                grid-template-columns: 1fr;
            }
            .leaderboard-content {
                padding: 20px;
            }
            #player-name {
                width: 90%;
            }

            /* Show mobile controls on mobile */
            #mobile-controls {
                display: block;
            }

            /* Adjust menu button for mobile */
            #menu-toggle {
                width: 45px;
                height: 45px;
                top: 15px;
                right: 15px;
            }
            #menu-toggle span {
                width: 22px;
            }

            /* Compact HUD on mobile */
            #ui {
                top: 15px;
                left: 15px;
                padding: 10px 12px;
                min-width: 160px;
                gap: 6px;
            }
            .hud-label {
                font-size: 9px;
            }
            .hud-value {
                font-size: 12px;
            }

            /* Smaller compass on mobile */
            #destination-arrow {
                width: 65px;
                height: 65px;
                top: 15px;
                left: 15px;
                margin-top: 115px;
            }
            .compass-needle::before {
                top: 6px;
                border-left: 6px solid transparent;
                border-right: 6px solid transparent;
                border-bottom: 15px solid #00ff00;
            }
            .compass-distance {
                font-size: 9px;
                bottom: 6px;
            }

            .asteroid-warning {
                width: 35px;
                height: 35px;
            }
            .asteroid-warning.edge-top::after,
            .asteroid-warning.edge-bottom::after {
                border-left-width: 5px;
                border-right-width: 5px;
                border-bottom-width: 10px;
                border-top-width: 10px;
            }
            .asteroid-warning.edge-left::after,
            .asteroid-warning.edge-right::after {
                border-top-width: 5px;
                border-bottom-width: 5px;
                border-right-width: 10px;
                border-left-width: 10px;
            }
        }

        /* Small mobile screens */
        @media (max-width: 480px) {
            #dpad-container {
                bottom: 15px;
                left: 10px;
            }

            #dpad {
                grid-template-columns: 55px 55px 55px;
                grid-template-rows: 55px 55px 55px;
                gap: 3px;
            }

            .dpad-btn {
                width: 55px;
                height: 55px;
                font-size: 24px;
            }

            #action-buttons {
                bottom: 15px;
                right: 10px;
                gap: 8px;
            }

            .action-btn {
                width: 75px;
                height: 42px;
                font-size: 11px;
            }

            /* Extra compact HUD on very small screens */
            #ui {
                top: 10px;
                left: 10px;
                padding: 8px 10px;
                min-width: 140px;
                gap: 5px;
            }
            .hud-label {
                font-size: 8px;
            }
            .hud-value {
                font-size: 11px;
            }

            /* Adjust compass for very small screens */
            #destination-arrow {
                margin-top: 105px;
            }

            #mobile-controls {
                height: 260px;
            }

            #destination-arrow {
                width: 55px;
                height: 55px;
                margin-top: 120px;
                top: 10px;
                left: 10px;
            }
            .compass-needle::before {
                top: 5px;
                border-left: 5px solid transparent;
                border-right: 5px solid transparent;
                border-bottom: 12px solid #00ff00;
            }
            .compass-needle::after {
                width: 5px;
                height: 5px;
            }
            .compass-distance {
                font-size: 8px;
                bottom: 5px;
            }
        }

        /* Landscape mobile adjustments */
        @media (max-width: 896px) and (orientation: landscape) {
            /* Compact HUD in landscape */
            #ui {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
                min-width: 150px;
            }
            .hud-label {
                font-size: 8px;
            }
            .hud-value {
                font-size: 11px;
            }
            #destination-arrow {
                margin-top: 100px;
            }

            #dpad-container {
                bottom: 15px;
                left: 10px;
            }

            #dpad {
                grid-template-columns: 50px 50px 50px;
                grid-template-rows: 50px 50px 50px;
                gap: 3px;
            }

            .dpad-btn {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }

            #action-buttons {
                bottom: 15px;
                right: 10px;
                gap: 6px;
            }

            .action-btn {
                width: 70px;
                height: 38px;
                font-size: 10px;
            }

            #mobile-controls {
                height: 180px;
            }

            #ui {
                top: 10px;
                left: 10px;
                padding: 10px;
                font-size: 12px;
            }

            #menu-toggle {
                width: 40px;
                height: 40px;
                top: 10px;
                right: 10px;
                gap: 4px;
            }
            #menu-toggle span {
                width: 20px;
                height: 2px;
            }

            #destination-arrow {
                width: 50px;
                height: 50px;
                margin-top: 105px;
                top: 10px;
                left: 10px;
            }
            .compass-needle::before {
                top: 5px;
                border-left: 5px solid transparent;
                border-right: 5px solid transparent;
                border-bottom: 10px solid #00ff00;
            }
            .compass-needle::after {
                width: 4px;
                height: 4px;
            }
            .compass-distance {
                font-size: 7px;
                bottom: 4px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="destination-arrow">
        <div class="compass-needle"></div>
        <div class="compass-distance">0m</div>
    </div>
    <div id="asteroid-warnings"></div>
    <div id="ui">
        <div class="hud-item">
            <span class="hud-label">TRACK</span>
            <span class="hud-value" id="track-name">-</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">TIME</span>
            <span class="hud-value"><span id="time">0.00</span>s</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">STATUS</span>
            <span class="hud-value" id="status">Ready</span>
        </div>
    </div>

    <!-- Hamburger Menu Button -->
    <button id="menu-toggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Slide-out Menu -->
    <div id="menu-panel">
        <div id="menu-content">
            <h3>Menu</h3>

            <div class="menu-section">
                <button id="menu-leaderboard-btn" class="menu-btn">View Leaderboards</button>
            </div>

            <div class="menu-section">
                <h4>Controls</h4>
                <div id="menu-controls">
                    <p id="control-start">Enter: Start countdown</p>
                    <p id="control-arrows">Arrow Keys: Apply thrust</p>
                    <p id="control-brake">Space: Brake</p>
                    <p id="control-reset">ESC: Reset race</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <!-- D-Pad for directional control -->
        <div id="dpad-container">
            <div id="dpad">
                <button class="dpad-btn" id="dpad-up" data-key="ArrowUp">▲</button>
                <button class="dpad-btn" id="dpad-left" data-key="ArrowLeft">◀</button>
                <button class="dpad-btn" id="dpad-center"></button>
                <button class="dpad-btn" id="dpad-right" data-key="ArrowRight">▶</button>
                <button class="dpad-btn" id="dpad-down" data-key="ArrowDown">▼</button>
            </div>
        </div>

        <!-- Action buttons -->
        <div id="action-buttons">
            <button class="action-btn" id="btn-brake" data-key=" ">BRAKE</button>
            <button class="action-btn" id="btn-start" data-key="Enter">START</button>
            <button class="action-btn" id="btn-reset" data-key="Escape">RESET</button>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdown-overlay">
        <div id="countdown-number"></div>
    </div>

    <!-- Crash Screen -->
    <div id="crash-screen" class="overlay-screen">
        <div class="screen-content">
            <div class="screen-title">CRASHED!</div>
            <div class="screen-message">You collided with an asteroid</div>
            <div class="screen-instruction">Press ESC to try again</div>
        </div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="overlay-screen">
        <div class="screen-content">
            <div class="screen-title">VICTORY!</div>
            <div class="screen-message">You completed the course!</div>
            <div class="screen-time" id="win-time">Time: 0.00s</div>
            <div id="score-submission" class="score-form">
                <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" />
                <button id="submit-score-btn">Save Score</button>
                <div id="submission-status"></div>
            </div>
            <div class="screen-instruction">Press ESC to race again</div>
        </div>
    </div>

    <!-- Leaderboard Screen -->
    <div id="leaderboard-screen" class="overlay-screen">
        <div class="leaderboard-content">
            <div class="leaderboard-header">
                <h1>LEADERBOARDS</h1>
                <p id="leaderboard-track">Track: <span></span></p>
                <button id="close-leaderboard">Close</button>
            </div>
            <div class="leaderboard-platforms">
                <div class="platform-leaderboard">
                    <h2>PC</h2>
                    <div id="pc-leaderboard" class="leaderboard-list"></div>
                </div>
                <div class="platform-leaderboard">
                    <h2>Mobile</h2>
                    <div id="mobile-leaderboard" class="leaderboard-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
